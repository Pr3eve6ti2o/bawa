name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout@v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Assert versions and record runner image
        run: |
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          cat /etc/os-release
          test "$(node --version)" = "v22.23.4"
          test "$(npm --version)" = "10.9.9"

      - name: Install Node dependencies
        working-directory: tools/hdwallet-gen
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: tools/hdwallet-gen
        run: npm run check

      - name: Run smoke tests
        working-directory: tools/hdwallet-gen
        run: npm test

      - name: Assert live generation refuses without a TTY
        working-directory: tools/hdwallet-gen
        run: |
          if output=$(node generate.js </dev/null 2>&1); then exit 1; fi
          printf '%s\n' "$output" | grep -Fq 'no controlling terminal'

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout@v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python@v5
        with:
          python-version: '3.13.18'

      - name: Assert versions and record runner image
        run: |
          test "$(python --version)" = "Python 3.13.18"
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          cat /etc/os-release

      - name: Install Python reference-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run independent bip_utils reference test
        run: python test/differential_test.py 2>&1 | tee differential_test.log

      - name: Run decrypt round-trip tests
        run: python test/test_decrypt_seed.py 2>&1 | tee test_decrypt_seed.log

      - name: Run make-wallet tests
        run: python test/test_make_wallet.py 2>&1 | tee test_make_wallet.log

      - name: Compile Python tools
        run: python -m py_compile tools/make_wallet.py tools/decrypt_seed.py

      - name: Require test output
        run: test -s differential_test.log && test -s test_decrypt_seed.log && test -s test_make_wallet.log
