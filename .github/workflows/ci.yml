name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        working-directory: tools/hdwallet-gen
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: tools/hdwallet-gen
        run: npm run check

      - name: Run smoke tests
        working-directory: tools/hdwallet-gen
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python reference-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run independent bip_utils reference test
        run: python test/differential_test.py

      - name: Compile Python tools
        run: python -m py_compile tools/make_wallet.py tools/decrypt_seed.py
