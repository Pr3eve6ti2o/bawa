research_only:
  - id: REF-01
    name: Edge React GUI
    repository: https://github.com/EdgeApp/edge-react-gui
    pinned_commit: 95f46b8fb856e1e15531ab800c88f55df7411e38
    licence: BSD-3-Clause
    status: full_wallet_reference_only
    reason: Full application is coupled to its own engine and product architecture; study UX and components, do not treat as a drop-in Bawa template.
  - id: REF-02
    name: XChain Platform Wallet
    repository: https://github.com/XChain-Platform/xchain-wallet
    pinned_commit: 3e550d05e913e29e5c3cf24527bf504f1a4fe942
    licence: AGPL-3.0
    status: architecture_reference_only
    reason: Separate large wallet platform and AGPL-3.0 obligations; do not offer it as a normal copyable template without explicit licensing approval.
  - id: REF-03
    name: OWASP Wallet UX Security Handbook
    repository: https://scs.owasp.org/handbooks/09-ux-security/
    status: mandatory_ux_security_reference
    reason: Security UX principles and scoring; not a template.
  - id: REF-04
    name: WCAG 2.2
    repository: https://www.w3.org/TR/WCAG22/
    status: mandatory_accessibility_reference
    reason: Accessibility acceptance baseline; not a template.

canonical_bawa_screen_contract:
  source: docs/14-wallet-app-implementation/README.md section 5.1
  screens:
    - Welcome
    - Create wallet
    - Import wallet
    - Mnemonic backup
    - Portfolio dashboard
    - Asset list
    - Asset detail
    - Receive
    - Send
    - Transaction history
    - Transaction details
    - Network selection
    - Wallet management
    - Security and backup settings
  required_states:
    - Loading
    - Empty
    - Stale
    - Locked
    - Gate-failed
    - Error
  notes:
    - Review is a required state of Send, not an additional screen.
    - Lock is a required application state, not an additional screen.
    - Do not add or remove screens without maintainer approval.
