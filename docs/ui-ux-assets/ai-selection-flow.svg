    </defs><rect x="0" y="0" width="1400" height="770" rx="0" fill="#f6f8fc" stroke="none" stroke-width="1" /><text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="22" fill="#5b63bc" font-weight="700" text-anchor="start">AI WALLET BUILDER · DECISION FLOW</text><text x="60" y="118" font-family="Inter, Arial, sans-serif" font-size="42" fill="#1c2944" font-weight="700" text-anchor="start">Only show source-backed choices</text><text x="60" y="158" font-family="Inter, Arial, sans-serif" font-size="18" fill="#67748d" font-weight="400" text-anchor="start">The platform decides which template menu appears. Design references are a separate choice.</text><rect x="60" y="220" width="250" height="112" rx="18" fill="#ffffff" stroke="#d9e0ec" stroke-width="2" /><text x="80" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273651" font-weight="700" text-anchor="start">1  User request</text><text x="80" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6c7890" font-weight="500" text-anchor="start">Create a Web wallet</text><rect x="360" y="220" width="250" height="112" rx="18" fill="#ffffff" stroke="#d9e0ec" stroke-width="2" /><text x="380" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273651" font-weight="700" text-anchor="start">2  Platform</text><text x="380" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6c7890" font-weight="500" text-anchor="start">Web / Android / Both</text><rect x="660" y="220" width="250" height="112" rx="18" fill="#ffffff" stroke="#d9e0ec" stroke-width="2" /><text x="680" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273651" font-weight="700" text-anchor="start">3  Template menu</text><text x="680" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6c7890" font-weight="500" text-anchor="start">Only compatible IDs</text><rect x="960" y="220" width="340" height="112" rx="18" fill="#ffffff" stroke="#d9e0ec" stroke-width="2" /><text x="980" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273651" font-weight="700" text-anchor="start">4  Visual direction</text><text x="980" y="295" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6c7890" font-weight="500" text-anchor="start">Choose one design profile</text><line x1="310" y1="276" x2="360" y2="276" stroke="#8b95ad" stroke-width="3"/><polygon points="351,269 360,276 351,283" fill="#8b95ad"/><line x1="610" y1="276" x2="660" y2="276" stroke="#8b95ad" stroke-width="3"/><polygon points="651,269 660,276 651,283" fill="#8b95ad"/><line x1="910" y1="276" x2="960" y2="276" stroke="#8b95ad" stroke-width="3"/><polygon points="951,269 960,276 951,283" fill="#8b95ad"/><rect x="60" y="470" width="340" height="136" rx="18" fill="#eef1ff" stroke="#cbd2f2" stroke-width="2" /><text x="80" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#283b70" font-weight="700" text-anchor="start">5  Inspect + pin</text><text x="80" y="551" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5e6c92" font-weight="500" text-anchor="start">Verify source, licence and exact commit</text><rect x="460" y="470" width="340" height="136" rx="18" fill="#eef1ff" stroke="#cbd2f2" stroke-width="2" /><text x="480" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#283b70" font-weight="700" text-anchor="start">6  Adapt presentation</text><text x="480" y="551" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5e6c92" font-weight="500" text-anchor="start">Replace mock data; connect Bawa ports</text><rect x="860" y="470" width="440" height="136" rx="18" fill="#eef1ff" stroke="#cbd2f2" stroke-width="2" /><text x="880" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#283b70" font-weight="700" text-anchor="start">7  Verify + deliver</text><text x="880" y="551" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5e6c92" font-weight="500" text-anchor="start">14 screens, states, tests and limitations</text><line x1="1130" y1="332" x2="1130" y2="410" stroke="#8b95ad" stroke-width="3"/><line x1="230" y1="410" x2="1130" y2="410" stroke="#8b95ad" stroke-width="3"/><line x1="230" y1="410" x2="230" y2="470" stroke="#8b95ad" stroke-width="3"/><polygon points="221,460 230,470 239,460" fill="#8b95ad"/><line x1="400" y1="538" x2="460" y2="538" stroke="#8b95ad" stroke-width="3"/><polygon points="451,531 460,538 451,545" fill="#8b95ad"/><line x1="800" y1="538" x2="860" y2="538" stroke="#8b95ad" stroke-width="3"/><polygon points="851,531 860,538 851,545" fill="#8b95ad"/><rect x="60" y="662" width="1240" height="58" rx="14" fill="#1f2b48" stroke="none" stroke-width="1" /><text x="680" y="698" font-family="Inter, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">No unlisted templates · no invented compatibility · no silent engine substitution</text></svg>