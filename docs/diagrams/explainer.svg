    <rect class="chip" x="16" y="532" width="368" height="14" rx="6"/><text class="b" x="24" y="542.5">+62 more — ZKsync Era · Cronos · Kava EVM · Filecoin · Ronin · Theta · IoTeX</text>
    <rect class="chip" x="16" y="548" width="368" height="14" rx="6"/><text class="b" x="24" y="558.5">Cosmos · Stellar · Polkadot · NEAR · Aptos · Tezos · Algorand · Hedera · …</text>
