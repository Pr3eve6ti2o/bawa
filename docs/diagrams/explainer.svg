<svg xmlns="http://www.w3.org/2000/svg" width="400" height="490" viewBox="0 0 400 490" role="img" aria-labelledby="expTitle expDesc">
  <title id="expTitle">One phrase, one account, 22 chains</title>
  <desc id="expDesc">One 24-word recovery phrase creates one HD wallet account, which derives one address on each of 22 chains: Bitcoin, Ethereum, TRON, TON, Solana, BNB Smart Chain, Polygon, Arbitrum One, OP Mainnet, Base, Avalanche C-Chain, Litecoin, Dogecoin, Gnosis, Celo, Linea, Mantle, Scroll, opBNB, Metis, Aurora and Fantom. The 16 EVM chains share one address.</desc>
  <style>
    .t { font-family: "Baloo 2", "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; }
    .b { font-family: Inter, "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; }
    .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #2B2B2B; }
    .card { fill: #FFFDF7; stroke: #2B2B2B; stroke-width: 2; }
    .chip { fill: #FFFDF7; stroke: #2B2B2B; stroke-width: 1.5; }
    .arrow { stroke: #2B2B2B; stroke-width: 2; fill: none; }
    .lbl { font-family: Inter, "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; paint-order: stroke; stroke: #FFFDF7; stroke-width: 4; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2B2B2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="490" fill="#FFFDF7"/>

  <text class="t" x="200" y="28" font-size="17.5" font-weight="700" text-anchor="middle">One phrase → one account → 22 chains</text>
  <path d="M120,38 q10,-4 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Phrase card -->
  <rect class="card" x="16" y="50" width="368" height="70" rx="12"/>
  <rect x="30" y="62" width="11" height="11" rx="2" fill="#FF6B4A"/>
  <text class="t" x="48" y="73" font-size="13.5" font-weight="700">24-word recovery phrase</text>
  <text class="b" x="30" y="92" font-size="10.5">BIP-39 · made in your browser, never leaves it</text>
  <g fill="#FFD93B" stroke="#2B2B2B" stroke-width="1">
    <rect x="30" y="100" width="8" height="8" rx="2"/><rect x="43" y="100" width="8" height="8" rx="2"/><rect x="56" y="100" width="8" height="8" rx="2"/><rect x="69" y="100" width="8" height="8" rx="2"/><rect x="82" y="100" width="8" height="8" rx="2"/><rect x="95" y="100" width="8" height="8" rx="2"/><rect x="108" y="100" width="8" height="8" rx="2"/><rect x="121" y="100" width="8" height="8" rx="2"/><rect x="134" y="100" width="8" height="8" rx="2"/><rect x="147" y="100" width="8" height="8" rx="2"/><rect x="160" y="100" width="8" height="8" rx="2"/><rect x="173" y="100" width="8" height="8" rx="2"/><rect x="186" y="100" width="8" height="8" rx="2"/><rect x="199" y="100" width="8" height="8" rx="2"/><rect x="212" y="100" width="8" height="8" rx="2"/><rect x="225" y="100" width="8" height="8" rx="2"/><rect x="238" y="100" width="8" height="8" rx="2"/><rect x="251" y="100" width="8" height="8" rx="2"/><rect x="264" y="100" width="8" height="8" rx="2"/><rect x="277" y="100" width="8" height="8" rx="2"/><rect x="290" y="100" width="8" height="8" rx="2"/><rect x="303" y="100" width="8" height="8" rx="2"/><rect x="316" y="100" width="8" height="8" rx="2"/><rect x="329" y="100" width="8" height="8" rx="2"/>
  </g>

  <!-- Arrow 1 -->
  <path class="arrow" d="M200,120 L200,138" marker-end="url(#ah2)"/>
  <text class="lbl" x="208" y="133" font-size="10.5">derives</text>

  <!-- Account card -->
  <rect class="card" x="16" y="140" width="368" height="56" rx="12"/>
  <rect x="30" y="152" width="11" height="11" rx="2" fill="#FFD93B" stroke="#2B2B2B" stroke-width="1.5"/>
  <text class="t" x="48" y="163" font-size="13.5" font-weight="700">One account — one HD wallet</text>
  <text class="m" x="30" y="183" font-size="10.5">createWallet() · 32 random bytes</text>

  <!-- Arrow 2 -->
  <path class="arrow" d="M200,196 L200,214" marker-end="url(#ah2)"/>
  <text class="lbl" x="208" y="209" font-size="10.5">22 addresses</text>

  <!-- Chains -->
  <text class="t" x="16" y="234" font-size="13.5" font-weight="700">22 chains</text>
  <text class="b" x="384" y="234" font-size="10.5" text-anchor="end">16 share one EVM address</text>
  <g font-size="9.5">
    <rect class="chip" x="16" y="242" width="180" height="14" rx="6"/><text class="b" x="24" y="252.5">BTC · Bitcoin</text>
    <rect class="chip" x="204" y="242" width="180" height="14" rx="6"/><text class="b" x="212" y="252.5">LTC · Litecoin</text>
    <rect class="chip" x="16" y="258" width="180" height="14" rx="6"/><text class="b" x="24" y="268.5">ETH · Ethereum</text>
    <rect class="chip" x="204" y="258" width="180" height="14" rx="6"/><text class="b" x="212" y="268.5">DOGE · Dogecoin</text>
    <rect class="chip" x="16" y="274" width="180" height="14" rx="6"/><text class="b" x="24" y="284.5">TRX · TRON</text>
    <rect class="chip" x="204" y="274" width="180" height="14" rx="6"/><text class="b" x="212" y="284.5">GNO · Gnosis</text>
    <rect class="chip" x="16" y="290" width="180" height="14" rx="6"/><text class="b" x="24" y="300.5">TON · TON</text>
    <rect class="chip" x="204" y="290" width="180" height="14" rx="6"/><text class="b" x="212" y="300.5">CELO · Celo</text>
    <rect class="chip" x="16" y="306" width="180" height="14" rx="6"/><text class="b" x="24" y="316.5">SOL · Solana</text>
    <rect class="chip" x="204" y="306" width="180" height="14" rx="6"/><text class="b" x="212" y="316.5">LINEA · Linea</text>
    <rect class="chip" x="16" y="322" width="180" height="14" rx="6"/><text class="b" x="24" y="332.5">BSC · BNB Smart Chain</text>
    <rect class="chip" x="204" y="322" width="180" height="14" rx="6"/><text class="b" x="212" y="332.5">MNT · Mantle</text>
    <rect class="chip" x="16" y="338" width="180" height="14" rx="6"/><text class="b" x="24" y="348.5">MATIC · Polygon</text>
    <rect class="chip" x="204" y="338" width="180" height="14" rx="6"/><text class="b" x="212" y="348.5">SCROLL · Scroll</text>
    <rect class="chip" x="16" y="354" width="180" height="14" rx="6"/><text class="b" x="24" y="364.5">ARB · Arbitrum One</text>
    <rect class="chip" x="204" y="354" width="180" height="14" rx="6"/><text class="b" x="212" y="364.5">OPBNB · opBNB</text>
    <rect class="chip" x="16" y="370" width="180" height="14" rx="6"/><text class="b" x="24" y="380.5">OP · OP Mainnet</text>
    <rect class="chip" x="204" y="370" width="180" height="14" rx="6"/><text class="b" x="212" y="380.5">METIS · Metis</text>
    <rect class="chip" x="16" y="386" width="180" height="14" rx="6"/><text class="b" x="24" y="396.5">BASE · Base</text>
    <rect class="chip" x="204" y="386" width="180" height="14" rx="6"/><text class="b" x="212" y="396.5">AURORA · Aurora</text>
    <rect class="chip" x="16" y="402" width="180" height="14" rx="6"/><text class="b" x="24" y="412.5">AVAX · Avalanche C-Chain</text>
    <rect class="chip" x="204" y="402" width="180" height="14" rx="6"/><text class="b" x="212" y="412.5">FTM · Fantom</text>
  </g>

  <!-- Features -->
  <g font-size="11">
    <text class="b" x="16" y="438"><tspan fill="#FF6B4A" font-weight="700">✓</tspan> Self-custodial — keys stay on your device</text>
    <text class="b" x="16" y="455"><tspan fill="#FF6B4A" font-weight="700">✓</tspan> Real balances &amp; prices — never invented</text>
    <text class="b" x="16" y="472"><tspan fill="#FF6B4A" font-weight="700">✓</tspan> Broadcast disabled — it cannot move funds</text>
  </g>
</svg>
