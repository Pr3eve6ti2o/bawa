<svg xmlns="http://www.w3.org/2000/svg" width="400" height="692" viewBox="0 0 400 692" role="img" aria-labelledby="expTitle expDesc">
  <title id="expTitle">One phrase, one account, 87 chains</title>
  <desc id="expDesc">Bawa is an HD-wallet reference and AI Wallet Builder: one 24-word recovery phrase creates one HD wallet account, which derives one address on each of 87 chains. The 57 chains at m/44'/60'/0'/0/0 share one key — 56 EVM chains render it as the same 0x address (Ronin shares the key with a ronin: prefix) and Injective renders it bech32; the other 30 have their own paths. TON and SOL use Ed25519, the rest use secp256k1 — one literal pubkey for all chains is impossible in any standards-compliant wallet. Chain labels use the wallet registry's own native symbols. The web wallet is one example output — the HD wallet stands alone; Android and more wallets are planned.</desc>
  <style>
    .t { font-family: "Baloo 2", "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; }
    .b { font-family: Inter, "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; }
    .m { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #2B2B2B; }
    .card { fill: #FFFDF7; stroke: #2B2B2B; stroke-width: 2; }
    .chip { fill: #FFFDF7; stroke: #2B2B2B; stroke-width: 1.5; }
    .chipEvm { fill: #FFF3C4; stroke: #2B2B2B; stroke-width: 1.5; }
    .limit { fill: #FFF3C4; stroke: #2B2B2B; stroke-width: 2; }
    .arrow { stroke: #2B2B2B; stroke-width: 2; fill: none; }
    .lbl { font-family: Inter, "Trebuchet MS", Verdana, sans-serif; fill: #2B2B2B; paint-order: stroke; stroke: #FFFDF7; stroke-width: 4; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2B2B2B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="692" fill="#FFFDF7"/>

  <!-- Purpose line -->
  <text class="t" x="200" y="26" font-size="14.5" font-weight="700" text-anchor="middle">Bawa — an HD-wallet reference + AI Wallet Builder</text>
  <text class="b" x="200" y="42" font-size="10.5" text-anchor="middle">One 24-word phrase, one account, 87 chains.</text>
  <path d="M120,50 q10,-4 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Phrase card -->
  <rect class="card" x="16" y="58" width="368" height="64" rx="12"/>
  <rect x="30" y="69" width="11" height="11" rx="2" fill="#FF6B4A"/>
  <text class="t" x="48" y="80" font-size="13.5" font-weight="700">24-word recovery phrase</text>
  <text class="b" x="30" y="98" font-size="10.5">BIP-39 · made in your browser, never leaves it</text>
  <g fill="#FFD93B" stroke="#2B2B2B" stroke-width="1">
    <rect x="30" y="106" width="8" height="8" rx="2"/><rect x="43" y="106" width="8" height="8" rx="2"/><rect x="56" y="106" width="8" height="8" rx="2"/><rect x="69" y="106" width="8" height="8" rx="2"/><rect x="82" y="106" width="8" height="8" rx="2"/><rect x="95" y="106" width="8" height="8" rx="2"/><rect x="108" y="106" width="8" height="8" rx="2"/><rect x="121" y="106" width="8" height="8" rx="2"/><rect x="134" y="106" width="8" height="8" rx="2"/><rect x="147" y="106" width="8" height="8" rx="2"/><rect x="160" y="106" width="8" height="8" rx="2"/><rect x="173" y="106" width="8" height="8" rx="2"/><rect x="186" y="106" width="8" height="8" rx="2"/><rect x="199" y="106" width="8" height="8" rx="2"/><rect x="212" y="106" width="8" height="8" rx="2"/><rect x="225" y="106" width="8" height="8" rx="2"/><rect x="238" y="106" width="8" height="8" rx="2"/><rect x="251" y="106" width="8" height="8" rx="2"/><rect x="264" y="106" width="8" height="8" rx="2"/><rect x="277" y="106" width="8" height="8" rx="2"/><rect x="290" y="106" width="8" height="8" rx="2"/><rect x="303" y="106" width="8" height="8" rx="2"/><rect x="316" y="106" width="8" height="8" rx="2"/><rect x="329" y="106" width="8" height="8" rx="2"/>
  </g>

  <!-- Arrow 1 -->
  <path class="arrow" d="M200,122 L200,140" marker-end="url(#ah2)"/>
  <text class="lbl" x="208" y="135" font-size="10.5">derives</text>

  <!-- Account card -->
  <rect class="card" x="16" y="142" width="368" height="68" rx="12"/>
  <rect x="30" y="153" width="11" height="11" rx="2" fill="#FFD93B" stroke="#2B2B2B" stroke-width="1.5"/>
  <text class="t" x="48" y="164" font-size="13.5" font-weight="700">One account — one HD wallet</text>
  <text class="m" x="30" y="184" font-size="10.5">createWallet(passphrase = '') · 32 random bytes</text>
  <text class="m" x="30" y="201" font-size="10.5">HDWallet.createWithEntropy(entropy, passphrase)</text>

  <!-- Arrow 2 -->
  <path class="arrow" d="M200,210 L200,228" marker-end="url(#ah2)"/>
  <text class="lbl" x="208" y="223" font-size="10.5">84 addresses</text>

  <!-- Derivation panel -->
  <rect class="card" x="16" y="230" width="368" height="96" rx="12"/>
  <text class="t" x="30" y="250" font-size="12.5" font-weight="700">Derivation — one HDWallet, one address per chain</text>
  <text class="m" x="30" y="269" font-size="10.5">59 EVM · m/44'/60'/0'/0/0 — one shared address</text>
  <text class="m" x="30" y="285" font-size="10.5">BTC m/84'/0'/0'/0/0 · LTC m/84'/2'/0'/0/0</text>
  <text class="m" x="30" y="301" font-size="10.5">DOGE m/44'/3'/0'/0/0 · TRX m/44'/195'/0'/0/0</text>
  <text class="m" x="30" y="317" font-size="10.5">TON m/44'/607'/0' · SOL m/44'/501'/0' — Ed25519</text>

  <!-- Chains -->
  <text class="t" x="16" y="348" font-size="13.5" font-weight="700">87 chains</text>
  <text class="b" x="384" y="348" font-size="10.5" text-anchor="end">pale yellow = EVM · one shared address</text>
