  <!-- Honest limit -->
  <rect class="limit" x="16" y="576" width="368" height="58" rx="10"/>
  <text class="b" x="30" y="596" font-size="10.5">One literal pubkey for all chains is impossible in any</text>
  <text class="b" x="30" y="610" font-size="10.5">standards-compliant wallet: TON and SOL use Ed25519;</text>
  <text class="b" x="30" y="624" font-size="10.5">the others use secp256k1, with different address formats.</text>

  <!-- Footer -->
  <text class="b" x="16" y="652" font-size="10.5">Web wallet is one example output — the HD wallet stands alone;</text>
