    <rect class="chipEvm" x="16" y="420" width="180" height="14" rx="6"/><text class="b" x="24" y="430.5">OP Mainnet · ETH</text>
    <rect class="chipEvm" x="204" y="420" width="180" height="14" rx="6"/><text class="b" x="212" y="430.5">Base · ETH</text>
    <rect class="chipEvm" x="16" y="436" width="180" height="14" rx="6"/><text class="b" x="24" y="446.5">Avalanche C-Chain · AVAX</text>
    <rect class="chip" x="204" y="436" width="180" height="14" rx="6"/><text class="b" x="212" y="446.5">Litecoin · LTC</text>
    <rect class="chip" x="16" y="452" width="180" height="14" rx="6"/><text class="b" x="24" y="462.5">Dogecoin · DOGE</text>
    <rect class="chipEvm" x="204" y="452" width="180" height="14" rx="6"/><text class="b" x="212" y="462.5">Gnosis · XDAI</text>
    <rect class="chipEvm" x="16" y="468" width="180" height="14" rx="6"/><text class="b" x="24" y="478.5">Celo · CELO</text>
    <rect class="chipEvm" x="204" y="468" width="180" height="14" rx="6"/><text class="b" x="212" y="478.5">Linea · ETH</text>
