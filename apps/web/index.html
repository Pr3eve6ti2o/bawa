<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Frame-buster (bug hunt S2; mechanism corrected 2026-11-28, DECISIONS §50).
      // GitHub Pages sends no custom headers, so frame-ancestors cannot
      // protect the live app — this script is the Pages deployment's only
      // framing defence, and it MUST stay inline in index.html, above the
      // build-injected CSP meta (inserted just before the closing head
      // tag): in Chromium a meta-delivered CSP does not retroactively govern
      // an inline script that appears before the meta element, so the script
      // runs under meta-only delivery; the same script IS blocked by the
      // HTTP-header CSP wherever headers are served (vite preview logs one
      // console error per load for it), and framing there is blocked by the
      // frame-ancestors / X-Frame-Options headers instead.
      // Honest mechanism, verified first-hand in Chromium 159: the bust-out
      // itself does NOT work any more — Chrome blocks a cross-origin
      // top-level navigation with no user gesture, so
      // window.top.location.href throws and the catch hides the whole page
      // (display none). The protection on Pages is that fail-closed hiding,
      // not the navigation: a framed wallet renders nothing. Do NOT remove
      // this script without a header-sending host, and do NOT move it into
      // the bundle: a deferred module script runs after first paint, so the
      // framed page could flash its content before the hide runs. Do NOT add
      // unsafe-inline to script-src to silence the preview console error —
      // that would bless all inline scripts.
      try {
        if (window.top !== window.self) {
          window.top.location.href = window.self.location.href;
        }
      } catch (err) {
        document.documentElement.style.display = 'none';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF7" />
    <base href="/" />
    <meta name="description" content="Bawa Web Wallet — a self-custodial multi-chain wallet. One recovery phrase for 87 chains. Your keys never leave this device." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bawa Web Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family: sans-serif; padding: 2rem; text-align: center;">Bawa Web Wallet needs JavaScript to run — the wallet cannot function without it. Your keys never leave this device.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
