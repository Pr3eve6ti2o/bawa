<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Frame-buster (bug hunt S2): GitHub Pages sends no custom
      // headers, so frame-ancestors cannot protect the live app.
      // This script MUST stay above the build-injected CSP meta
      // (inserted just before the closing head tag): a meta CSP only governs
      // content after it, and script-src has no unsafe-inline, so
      // a buster placed after the meta would be blocked and the
      // wallet would stay framable.
      try {
        if (window.top !== window.self) {
          window.top.location.href = window.self.location.href;
        }
      } catch (err) {
        document.documentElement.style.display = 'none';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF7" />
    <base href="/" />
    <meta name="description" content="Bawa Web Wallet — a self-custodial multi-chain wallet. One recovery phrase for 87 chains. Your keys never leave this device." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bawa Web Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="font-family: sans-serif; padding: 2rem; text-align: center;">Bawa Web Wallet needs JavaScript to run — the wallet cannot function without it. Your keys never leave this device.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
